<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حكواتي AI</title>
</head>
<body>
  <h1>🎙️ حكواتي AI</h1>
  <h2>حوّل صورتك إلى فيديو يتكلم بالذكاء الاصطناعي</h2>

  <p>ارفع الصورة</p>
  <input type="file" accept="image/*">

  <p>اكتب الكلام</p>
  <textarea placeholder="اكتب هنا الكلام الذي تريد أن تقوله الشخصية"></textarea>

  <br><br>
  <button>إنشاء الفيديو</button>
</body>
</html>
